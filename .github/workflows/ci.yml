name: ci

on:
  push:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the Nova assembly GPU driver
        run: |
          python3 Driver/novas.py Driver/gpu_driver.nova -o Driver/gpu_driver.bin
          ls -l Driver/gpu_driver.bin
      - name: Build the C hot core (round 3)
        run: |
          mkdir -p build
          # FP contract OFF and no fast-math: the C vector ops must
          # stay bit-identical to IEEE-754 Swift arithmetic — the
          # framebuffer checksums are the judge.
          clang -O3 -ffp-contract=off -fno-fast-math -c \
            Sources/NovaGPU/NovaGPUFast.c -o build/NovaGPUFast.o
      - name: Build bus host tests
        run: |
          swiftc -O -o build/hosttests \
            HostTests/main.swift \
            App/NovaGPUTest/NovaMemory.swift \
            Sources/NovaGPU/NovaGPUShader.swift \
            Sources/NovaGPU/NovaGPU.swift \
            Sources/NovaGPU/NovaGPUVector.swift \
            Sources/NovaGPU/NovaBus.swift \
            Sources/NovaGPU/NovaBusClient.swift \
            Sources/NovaGPU/NovaGPUStandard.swift \
            Sources/NovaGPU/NovaGovernor.swift \
            build/NovaGPUFast.o
      - name: Run bus host tests
        run: |
          set -o pipefail
          ./build/hosttests | tee build/hosttests.log
      - name: Build CPU proof (real NovaCPU core + driver)
        run: |
          swiftc -O -o build/proof \
            ProofTests/main.swift \
            App/NovaGPUTest/NovaCPU.swift \
            App/NovaGPUTest/NovaMemory.swift \
            App/NovaGPUTest/NovaJIT.swift \
            Sources/NovaGPU/NovaGPUShader.swift \
            Sources/NovaGPU/NovaGPU.swift \
            Sources/NovaGPU/NovaGPUVector.swift \
            Sources/NovaGPU/NovaBus.swift \
            Sources/NovaGPU/NovaBusClient.swift \
            Sources/NovaGPU/NovaGPUStandard.swift \
            Sources/NovaGPU/NovaGovernor.swift \
            build/NovaGPUFast.o
      - name: Run CPU proof
        run: |
          set -o pipefail
          ./build/proof Driver/gpu_driver.bin | tee build/proof.log
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/*.log

  bench:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build the C hot core
        run: |
          mkdir -p build
          clang -O3 -ffp-contract=off -fno-fast-math -c \
            Sources/NovaGPU/NovaGPUFast.c -o build/NovaGPUFast.o
      - name: Build bench harness (v4 profiling)
        run: |
          swiftc -O -o build/bench \
            BenchTests/main.swift \
            App/NovaGPUTest/NovaMemory.swift \
            Sources/NovaGPU/NovaGPUShader.swift \
            Sources/NovaGPU/NovaGPU.swift \
            Sources/NovaGPU/NovaGPUVector.swift \
            Sources/NovaGPU/NovaBus.swift \
            Sources/NovaGPU/NovaBusClient.swift \
            Sources/NovaGPU/NovaGPUStandard.swift \
            Sources/NovaGPU/NovaGovernor.swift \
            build/NovaGPUFast.o
      - name: Run benchmarks
        run: |
          set -o pipefail
          ./build/bench | tee build/bench.log
      - name: Upload bench log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-log
          path: build/bench.log

  build-ipa:
    runs-on: macos-26
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - name: Assemble driver into the app bundle resources
        run: python3 Driver/novas.py Driver/gpu_driver.nova -o App/NovaGPUTest/gpu_driver.bin
      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project App/NovaGPUTest.xcodeproj -scheme NovaGPUTest \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tee build/xcodebuild.log
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/dd/Build/Products/Release-iphoneos/NovaGPUTest.app Payload/
          zip -qry NovaGPU-Test-unsigned.ipa Payload
          ls -l NovaGPU-Test-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NovaGPU-Test-ipa
          path: NovaGPU-Test-unsigned.ipa
